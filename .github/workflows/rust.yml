name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --all --verbose
    - name: Run tests
      run: cargo test --all --verbose
    - name: Run tests (thiserror feature)
      run: cargo test --all --features thiserror --verbose
    - name: Check for panics in release builds
      run: cargo build --package test-build-protos --features assert-no-panic --release
    - name: Check for defmt end-to-end support
      run: cargo build --package test-build-protos --features defmt

  # Verifies the crate's core promise: that the library compiles for a bare-metal `no_std` target
  # (no operating system, no `alloc`). Catches accidental use of `std`/`alloc` or host-only
  # assumptions that a host build would not surface. Covers each optional feature too.
  no-std:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Add bare-metal target
      run: rustup target add thumbv7em-none-eabihf
    - name: Build library for bare-metal (default features)
      run: cargo build --package femtopb --target thumbv7em-none-eabihf --verbose
    - name: Build library for bare-metal (defmt)
      run: cargo build --package femtopb --target thumbv7em-none-eabihf --features defmt --verbose
    - name: Build library for bare-metal (thiserror)
      run: cargo build --package femtopb --target thumbv7em-none-eabihf --features thiserror --verbose

  # Guards against clippy regressions. Runs with both the default feature set and all features so
  # that feature-gated code paths are linted too. `-D warnings` turns any lint into a build failure.
  clippy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Clippy (default features)
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: Clippy (all features)
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Exercises the crate on a 32-bit target where `usize` is narrower than `u64`, so that
  # length-prefix handling (which differs between 16/32-bit and 64-bit targets) is actually
  # covered rather than only built.
  test-32bit:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install 32-bit target and multilib toolchain
      run: |
        rustup target add i686-unknown-linux-gnu
        sudo apt-get update
        sudo apt-get install -y gcc-multilib
    - name: Run tests on i686-unknown-linux-gnu
      run: cargo test --package femtopb --target i686-unknown-linux-gnu --features thiserror --verbose
